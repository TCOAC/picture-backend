server:
  port: 8123
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: picture-backend
  # 激活 local 环境配置（读取 application-local.yml）
  profiles:
    active: local
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/yx_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）


# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.example.picturebackend.controller

# Comma-separated browser origins. Keep this explicit because sessions use cookies.
app:
  storage: ${APP_STORAGE:local}
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    image-api-url: ${AI_IMAGE_API_URL:}
    api-key: ${AI_IMAGE_API_KEY:}
    model: ${AI_IMAGE_MODEL:}

# Tencent Cloud COS settings. Use environment variables or application-local.yml;
# never commit real credentials.
cos:
  client:
    host: ${COS_HOST:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}

